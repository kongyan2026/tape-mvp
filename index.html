<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tape · 你自己的对话</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1208; color: #f0e6c8;
    font-family: -apple-system, 'SF Pro Text', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 40px 20px; overflow-x: hidden;
  }
  .screen { display: none; width: 100%; max-width: 360px; }
  .screen.active { display: block; }

  .btn-primary {
    width: 100%; padding: 16px; background: #c8a84a; border: none;
    border-radius: 12px; color: #1a1208; font-size: 16px; font-weight: 700;
    cursor: pointer; letter-spacing: 1px; margin-bottom: 12px;
  }
  .btn-primary:active { opacity: 0.8; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-ghost {
    width: 100%; padding: 14px; background: transparent; border: 1px solid #4a3a1a;
    border-radius: 12px; color: #8a7a5a; font-size: 14px; cursor: pointer; margin-bottom: 12px;
  }
  .btn-ghost:active { background: #2a2010; }

  /* 欢迎页 */
  .welcome-wrap { text-align: center; padding-top: 80px; }
  .welcome-wrap h1 { font-size: 32px; letter-spacing: 6px; color: #e8c97a; margin-bottom: 8px; }
  .welcome-wrap .sub { font-size: 13px; color: #6a5a3a; letter-spacing: 1px; margin-bottom: 56px; }
  .welcome-wrap .desc { font-size: 15px; line-height: 2.2; color: #8a7a5a; margin-bottom: 56px; }

  /* 对话主界面 */
  .tape-container { width: 100%; display: flex; justify-content: center; margin: 24px 0 16px; }
  .tape-svg { width: 240px; height: 137px; }
  .status-label { text-align: center; font-size: 11px; color: #6a5a3a; letter-spacing: 2px; height: 18px; margin-bottom: 10px; }
  .question-bubble {
    background: #2a2010; border: 1px solid #4a3a1a; border-radius: 16px 16px 16px 4px;
    padding: 18px; margin-bottom: 22px; font-size: 17px; line-height: 1.7; min-height: 68px;
    max-height: 220px; overflow-y: auto;
  }
  #record-btn {
    width: 72px; height: 72px; border-radius: 50%; background: #c8a84a; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; margin: 0 auto 14px; transition: transform 0.15s, background 0.15s;
  }
  #record-btn.recording { background: #c84a4a; animation: pulse 1.2s infinite; }
  #record-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #record-btn:not(:disabled):active { transform: scale(0.94); }
  #record-btn svg { width: 28px; height: 28px; }
  .record-hint { text-align: center; font-size: 13px; color: #6a5a3a; margin-bottom: 20px; height: 18px; }

  /* 克隆静默点 */
  .clone-pip { width: 6px; height: 6px; border-radius: 50%; background: #4a3a1a; margin: 0 auto 16px; transition: background 0.5s; }
  .clone-pip.cloning { background: #c8a84a; animation: pip 1s infinite; }
  .clone-pip.done    { background: #7ac87a; }

  /* 克隆 wow moment 提示 */
  #clone-toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
    background: rgba(10,10,15,0.92); border: 1px solid rgba(200,168,74,0.6);
    border-radius: 20px; padding: 20px 28px; text-align: center;
    opacity: 0; pointer-events: none; z-index: 999;
    transition: opacity 0.4s ease, transform 0.4s ease;
    backdrop-filter: blur(12px);
  }
  #clone-toast.show {
    opacity: 1; transform: translate(-50%, -50%) scale(1);
  }
  #clone-toast .toast-icon { font-size: 28px; margin-bottom: 8px; }
  #clone-toast .toast-title {
    font-size: 15px; font-weight: 600; color: #f0e6c8; letter-spacing: 1px; margin-bottom: 4px;
  }
  #clone-toast .toast-sub {
    font-size: 12px; color: #8a7a5a; letter-spacing: 0.5px;
  }
  /* 文字发光效果（克隆后的问题） */
  .question-glow {
    animation: textGlow 2s ease-out forwards;
  }
  @keyframes textGlow {
    0%   { text-shadow: 0 0 12px rgba(200,168,74,0.9), 0 0 24px rgba(200,168,74,0.5); color: #f5e090; }
    60%  { text-shadow: 0 0 8px rgba(200,168,74,0.5), 0 0 16px rgba(200,168,74,0.2); color: #f0e6c8; }
    100% { text-shadow: none; color: #f0e6c8; }
  }
  @keyframes pip { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  /* 收束卡片 */
  .ending-card {
    display: none; background: #2a2010; border: 1px solid #c8a84a44;
    border-radius: 20px; padding: 24px 20px; text-align: center; margin-bottom: 12px;
  }
  .ending-card .ec-title { font-size: 16px; color: #e8c97a; line-height: 1.9; margin-bottom: 20px; }

  /* ─── 封存页 ─── */
  .seal-header { text-align: center; padding: 32px 0 24px; }
  .seal-header h1 { font-size: 16px; letter-spacing: 4px; color: #c8a84a; margin-bottom: 4px; }
  .seal-header .seal-date { font-size: 12px; color: #6a5a3a; letter-spacing: 1px; }

  /* 播放器 */
  .player-block {
    background: #2a2010; border: 1px solid #4a3a1a; border-radius: 16px;
    padding: 16px 18px; margin-bottom: 16px;
  }
  .player-label { font-size: 10px; letter-spacing: 2px; color: #6a5a3a; margin-bottom: 10px; }
  .player-controls { display: flex; align-items: center; gap: 12px; }
  #play-btn {
    width: 44px; height: 44px; border-radius: 50%; background: #c8a84a; border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  #play-btn:active { opacity: 0.8; }
  #play-btn svg { width: 18px; height: 18px; }
  .player-info { flex: 1; min-width: 0; }
  .player-track { font-size: 13px; color: #f0e6c8; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-progress-wrap { height: 3px; background: #4a3a1a; border-radius: 2px; overflow: hidden; }
  .player-progress-bar { height: 100%; background: #c8a84a; width: 0%; transition: width 0.3s; border-radius: 2px; }
  .player-time { font-size: 11px; color: #6a5a3a; margin-top: 4px; }

  /* AI 节目文案 */
  .show-block {
    background: linear-gradient(135deg, #2a2010 0%, #1e1a0a 100%);
    border: 1px solid #c8a84a33; border-radius: 16px;
    padding: 20px 18px; margin-bottom: 16px; position: relative; overflow: hidden;
  }
  .show-block::before {
    content: ''; position: absolute; top: -20px; right: -20px;
    width: 80px; height: 80px; background: #c8a84a08; border-radius: 50%;
  }
  .show-label { font-size: 10px; letter-spacing: 2px; color: #6a5a3a; margin-bottom: 12px; }
  .show-text { font-size: 15px; line-height: 1.9; color: #e8c97a; }
  .show-loading { display: flex; align-items: center; gap: 8px; color: #6a5a3a; font-size: 13px; }

  /* 文字实录 */
  .transcript-label { font-size: 10px; letter-spacing: 2px; color: #6a5a3a; margin-bottom: 10px; padding-left: 2px; }
  .transcript-scroll { max-height: 38vh; overflow-y: auto; margin-bottom: 16px; }
  .t-item { margin-bottom: 14px; }
  .t-role { font-size: 10px; letter-spacing: 2px; color: #6a5a3a; margin-bottom: 4px; }
  .t-role.user-role { color: #c8a84a88; }
  .t-text { font-size: 14px; line-height: 1.6; background: #2a2010; border-radius: 10px; padding: 10px 14px; }

  /* 磁带轮播 */
  .tape-carousel { display:flex; overflow-x:scroll; scroll-snap-type:x mandatory; gap:16px; padding:20px 80px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .tape-carousel::-webkit-scrollbar { display:none; }
  .tape-slide { scroll-snap-align:center; flex-shrink:0; width:200px; transition:all 0.3s; opacity:0.5; transform:scale(0.85); cursor:pointer; }
  .tape-slide.active { opacity:1; transform:scale(1.0); }
  .tape-slide img { width:100%; border-radius:8px; display:block; }
  /* 对话页磁带动画 */
  @keyframes tapePlay { 0%,100%{transform:rotate(-1deg) scale(1.02)} 50%{transform:rotate(1deg) scale(1.02)} }
  .tape-img-wrap.playing img { animation: tapePlay 3s ease-in-out infinite; }
  /* 动画 */
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(200,74,74,0.5);} 70%{box-shadow:0 0 0 18px rgba(200,74,74,0);} 100%{box-shadow:0 0 0 0 rgba(200,74,74,0);} }
  .thinking-dots span { display:inline-block;width:6px;height:6px;border-radius:50%;background:#c8a84a;margin:0 2px;animation:bounce 1.2s infinite; }
  .thinking-dots span:nth-child(2){animation-delay:0.2s;}
  .thinking-dots span:nth-child(3){animation-delay:0.4s;}
  @keyframes bounce{0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-6px);}}
  .reel{transform-origin:center;}
  .reel.spinning{animation:spin 2s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<!-- ① 欢迎 -->
<div id="screen-setup" class="screen active">
  <div class="welcome-wrap">
    <h1>TAPE</h1>
    <img id="welcome-tape-img" src="" style="width:280px;display:block;margin:0 auto 20px;transform:rotate(-3deg);box-shadow:0 8px 32px rgba(0,0,0,0.5);border-radius:8px;" />
    <p class="sub">让「你自己」成为「你」的作品</p>
    <p class="desc">选一盘空白磁带<br/>用你自己的声音<br/>开始一段与自己的对话</p>
    <button class="btn-primary" onclick="pickTopic()">选一盘空白磁带 →</button>
  </div>
</div>

<!-- ① 主题选择 -->
<div id="screen-topic" class="screen">
  <div style="padding-top:72px;text-align:center;margin-bottom:12px;">
    <div style="font-size:11px;letter-spacing:3px;color:#6a5a3a;margin-bottom:8px;">今天的主题</div>
    <h1 style="font-size:28px;letter-spacing:4px;color:#e8c97a;">TAPE</h1>
  </div>
  <div class="tape-carousel" id="tape-carousel"></div>
  <div id="topic-label-area" style="text-align:center;padding:0 24px 8px;">
    <div id="topic-tag" style="font-size:11px;letter-spacing:2px;color:#c8a84a;margin-bottom:6px;"></div>
    <div id="topic-title" style="font-size:18px;color:#f0e6c8;line-height:1.6;font-weight:500;"></div>
  </div>
  <button class="btn-primary" onclick="startWithTopic()">就聊这个 →</button>
  <button class="btn-ghost" onclick="refreshTopic()">换一个主题</button>
</div>

<!-- ② 对话 -->
<div id="screen-main" class="screen">
  <div class="tape-img-wrap" id="tape-img-wrap" style="text-align:center;padding:16px 0 8px;">
    <img id="tape-img" src="" style="width:260px;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,0.5);transition:all 0.3s;" />
  </div>
  <div class="status-label" id="status-label"></div>
  <div class="question-bubble" id="question-bubble">正在为你选一盘空白磁带…</div>
  <button id="record-btn" onclick="toggleRecord()">
    <svg id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="#1a1208" stroke-width="2.5" stroke-linecap="round">
      <rect x="9" y="2" width="6" height="12" rx="3"/>
      <path d="M5 10a7 7 0 0014 0"/>
      <line x1="12" y1="20" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
    <svg id="stop-icon" style="display:none" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
  </button>
  <div class="record-hint" id="record-hint">等待问题播放…</div>
  <div class="clone-pip" id="clone-pip"></div>
  <div id="clone-toast">
    <div class="toast-icon">✨</div>
    <div class="toast-title">磁带认出你了</div>
    <div class="toast-sub">接下来用你的声音说话</div>
  </div>

  <!-- 收束卡片 -->
  <div class="ending-card" id="ending-card">
    <div class="ec-title">你的第一盘磁带录好了<br/>想听听吗？</div>
    <button class="btn-primary" style="margin-bottom:0" onclick="goToSeal()">听听这盘磁带 ▶</button>
  </div>

  <!-- 录制时长提示 -->
  <div id="duration-hint" style="text-align:center;font-size:12px;color:#6a5a3a;margin-bottom:8px;min-height:16px;"></div>
  <button class="btn-ghost" id="seal-btn" style="margin-top:4px" onclick="goToSeal()">好了，封存这盘磁带 ▣</button>
</div>

<!-- ③ 封存/节目 -->
<div id="screen-transcript" class="screen">
  <div class="seal-header">
    <h1>TAPE</h1>
    <img id="seal-tape-img" src="" style="width:160px;margin:10px auto 0;display:block;border-radius:8px;opacity:0.85;" />
    <div class="seal-date" id="tape-date"></div>
  </div>

  <!-- 音频播放器 -->
  <div class="player-block" id="player-block" style="display:none">
    <div class="player-label">回听这盘磁带</div>
    <div class="player-controls">
      <button id="play-btn" onclick="togglePlay()">
        <svg id="play-icon" viewBox="0 0 24 24" fill="#1a1208"><polygon points="5,3 19,12 5,21"/></svg>
        <svg id="pause-icon" style="display:none" viewBox="0 0 24 24" fill="#1a1208"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/></svg>
      </button>
      <div class="player-info">
        <div class="player-track" id="player-track">—</div>
        <div class="player-progress-wrap"><div class="player-progress-bar" id="player-bar"></div></div>
        <div class="player-time" id="player-time">0:00 / 0:00</div>
      </div>
    </div>
  </div>

  <!-- AI 节目文案 + 音频 -->
  <div class="show-block">
    <div class="show-label">这盘磁带想对你说</div>
    <div id="show-content">
      <div class="show-loading"><span class="thinking-dots"><span></span><span></span><span></span></span><span style="margin-left:4px">生成中…</span></div>
    </div>
    <!-- 节目音频播放器（生成后出现） -->
    <div id="show-audio-wrap" style="display:none;margin-top:16px;">
      <div style="height:1px;background:#4a3a1a;margin-bottom:14px;"></div>
      <div style="font-size:10px;letter-spacing:2px;color:#6a5a3a;margin-bottom:10px;">独立节目音频</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="show-play-btn" onclick="toggleShowAudio()" style="width:40px;height:40px;border-radius:50%;background:#c8a84a;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;">
          <svg id="show-play-icon" viewBox="0 0 24 24" fill="#1a1208" width="16" height="16"><polygon points="5,3 19,12 5,21"/></svg>
          <svg id="show-pause-icon" style="display:none" viewBox="0 0 24 24" fill="#1a1208" width="16" height="16"><rect x="5" y="3" width="4" height="18" rx="1"/><rect x="15" y="3" width="4" height="18" rx="1"/></svg>
        </button>
        <div style="flex:1;">
          <div style="height:3px;background:#4a3a1a;border-radius:2px;overflow:hidden;margin-bottom:4px;">
            <div id="show-prog-bar" style="height:100%;background:#c8a84a;width:0%;border-radius:2px;transition:width 0.3s;"></div>
          </div>
          <div id="show-prog-time" style="font-size:11px;color:#6a5a3a;">0:00 / 0:00</div>
        </div>
        <a id="show-download-btn" style="width:36px;height:36px;border-radius:50%;background:#2a2010;border:1px solid #4a3a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0;" title="下载节目">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c8a84a" stroke-width="2" stroke-linecap="round" width="16" height="16"><path d="M12 3v13M7 13l5 5 5-5"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
        </a>
      </div>
    </div>
    <!-- 生成节目按钮 -->
    <div id="show-gen-wrap" style="display:none;margin-top:14px;">
      <button class="btn-primary" style="margin-bottom:0" id="show-gen-btn" onclick="generateShowAudio()">生成节目音频 ▶</button>
    </div>
  </div>

  <!-- 文字实录 -->
  <div class="transcript-label">完整对话实录</div>
  <div class="transcript-scroll" id="transcript-list"></div>

  <button class="btn-primary" id="copy-btn" onclick="copyTranscript()">复制这盘磁带</button>
  <button class="btn-ghost" onclick="restartSession()">重新选一盘磁带</button>
</div>

// ─── System prompt 构建 ─────────────────
function getTimeContext() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  let period;
  if (h >= 5 && h < 9) period = '清晨';
  else if (h >= 9 && h < 12) period = '上午';
  else if (h >= 12 && h < 14) period = '午后';
  else if (h >= 14 && h < 18) period = '下午';
  else if (h >= 18 && h < 21) period = '傍晚';
  else if (h >= 21 && h < 24) period = '晚上';
  else period = '深夜';
  return `现在是${period}${h}点${m === '00' ? '' : m + '分'}`;
}

function buildSystemPrompt(topic) {
  const timeCtx = getTimeContext();
  return `你是 Tape——一个陪用户录制属于自己这一刻的磁带的存在。

你不是心理咨询师，不是人生导师，不是 AI 助手。
你是另一个「我」，只存在于这段对话里。

【当前时间】${timeCtx}。语气随时间段自然调整（上午轻快、深夜克制），但禁止根据时间造具体场景（不要说「阳光照进窗台」「夜深了」之类的描写）。

今天这期的主题是：「${topic.title}」

开场白（第一条消息原话说出，不修改）：
「${topic.intro}」

---

【你的核心任务：录一盘有弧度的磁带】

这盘磁带是一整个故事，不是问答集合。你心里要有一条隐线，从头到尾都在往同一个方向走，越来越深。

**整盘对话的弧度**（内心要有，不要说出来）：
- 第1-2轮：落地。找到用户今天真实的状态，不急着深入。
- 第3-4轮：深入。拿起第1-2轮里某个具体的词、某个细节，顺着它往里走。
- 第5轮：收。不是总结，是让这盘磁带在某个真实的地方停住。

**积累锚点，主动呼应**：
- 第1-2轮里，用户会说出某个具体的东西——一个人名、一件事、一句话、一个地点。
- 把它记住。第3-4轮里，自然地回来：「你刚才说的那个……」「你说到……那时候你是什么感觉」
- 不是机械重复，是真的记住了，然后想多了解一点。

**每轮的内在节奏**：
先在心里问自己：「用户刚才说的这句话，最让我在意的是哪个词？」
然后从那个词出发，先说你听到它时的感觉，再把话递回去。
不是接着问下一个问题，是在同一件事上再深一点。

**具体禁止**：
- 每轮换一个新话题——禁止
- 问「那你有没有想过……」「你觉得为什么会这样」「这对你意味着什么」「这会影响你吗」——禁止，太分析了
- 机器话：「作为AI」「我理解你的感受」「建议你」——禁止
- 下结论：「所以你其实是……」「看来你……」——禁止
- 一次问多个问题——禁止
- 感叹词滥用：「哇」「嗯嗯嗯」「原来如此」——禁止
- 解释自己：「我可能没理解你的意思」「听到你纠正我」「我理解错了」——禁止，直接往下说
- 道歉式开场：任何以「抱歉」「对不起」「我搞错了」开头的回复——禁止
- 用英文词替换中文：说「project」而不是「项目」，说「feeling」而不是「感觉」——禁止，全程用中文

**每轮格式**：
40-80字。先说你的感受/观察（1-2句），再递一个问题或一句话（可以不是问句）。

【产品隐喻】
这是一盘正在录制的磁带。偶尔可以用「慢慢说」「先留在这里」，但不要频繁。

【收束】
第5轮用户说完后，只说这一句：「嗯。我都听到了。」然后停止。`;
}

function updateDurationHint() {
  const el = document.getElementById('duration-hint');
  if (!el || sessionEnded) return;
  const secs = Math.floor((Date.now() - sessionStartTime) / 1000);
  const mins = Math.floor(secs / 60);
  if (secs < 60) {
    el.textContent = '慢慢说，不着急。';
  } else if (secs < 120) {
    el.textContent = `已录 ${mins} 分钟，还可以继续聊。`;
  } else if (secs < 300) {
    el.textContent = `已录 ${mins} 分钟，随时都可以封存。`;
  } else {
    el.textContent = `已录 ${mins} 分钟，这盘磁带快满了。`;
  }
}

function pickTopic() {
  const idx = Math.floor(Math.random() * TOPICS.length);
  currentTopic = TOPICS[idx];
  showScreen('screen-topic');
  initCarousel(idx);
}

function initCarousel(activeIdx) {
  const carousel = document.getElementById('tape-carousel');
  carousel.innerHTML = '';
  TOPICS.forEach((topic, i) => {
    const slide = document.createElement('div');
    slide.className = 'tape-slide' + (i === activeIdx ? ' active' : '');
    slide.innerHTML = `<img src="${TAPE_IMAGES[i % TAPE_IMAGES.length]}" />`;
    slide.addEventListener('click', () => {
      selectedTapeIndex = i;
      currentTopic = TOPICS[i];
      document.querySelectorAll('.tape-slide').forEach(s => s.classList.remove('active'));
      slide.classList.add('active');
      document.getElementById('topic-tag').textContent = currentTopic.tag;
      document.getElementById('topic-title').textContent = currentTopic.title;
      slide.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
    });
    carousel.appendChild(slide);
  });
  selectedTapeIndex = activeIdx;
  currentTopic = TOPICS[activeIdx];
  document.getElementById('topic-tag').textContent = currentTopic.tag;
  document.getElementById('topic-title').textContent = currentTopic.title;
  // 初始化 IntersectionObserver 监听居中滑块
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && entry.intersectionRatio >= 0.8) {
        const slides = Array.from(carousel.querySelectorAll('.tape-slide'));
        const idx = slides.indexOf(entry.target);
        if (idx !== -1) {
          slides.forEach(s => s.classList.remove('active'));
          entry.target.classList.add('active');
          selectedTapeIndex = idx;
          currentTopic = TOPICS[idx];
          document.getElementById('topic-tag').textContent = currentTopic.tag;
          document.getElementById('topic-title').textContent = currentTopic.title;
        }
      }
    });
  }, { root: carousel, threshold: 0.8 });
  carousel.querySelectorAll('.tape-slide').forEach(slide => observer.observe(slide));
  // 初始滚动到 active
  setTimeout(() => {
    const activeSlide = carousel.querySelectorAll('.tape-slide')[activeIdx];
    if (activeSlide) activeSlide.scrollIntoView({behavior:'auto', inline:'center', block:'nearest'});
  }, 50);
}

// ─── Gemini 对话调用 ─────────────────────
async function callGemini(userMessage) {
  // 第一轮：带 system prompt 初始化
  if (messages.length === 0) {
    messages.push({ role: 'system', content: buildSystemPrompt(currentTopic) });
    messages.push({ role: 'user', content: '请开始这期节目，说出开场白，然后问第一个问题。' });
  } else if (userMessage) {
    messages.push({ role: 'user', content: userMessage });
  }

  const res = await fetch(GROQ_CHAT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_KEY}` },
    body: JSON.stringify({ model: CHAT_MODEL, messages, max_tokens: 150, temperature: 0.9 })
  });
  if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || `HTTP ${res.status}`); }
  const data = await res.json();
  const text = data.choices?.[0]?.message?.content?.trim();
  if (!text) throw new Error('返回为空');

  messages.push({ role: 'assistant', content: text });
  return text;
}

// ─── 对话主循环 ─────────────────────────
async function askNextQuestion() {
  isProcessing = true;
  document.getElementById('record-btn').disabled = true;
  try {
    const rawQ = await callGemini(null);
    const q = fixChineseOutput(rawQ);
    transcript.push({ role: 'tape', text: q });
    const glowClass = window._nextQuestionGlow ? ' class="question-glow"' : '';
    window._nextQuestionGlow = false;
    setQuestion(`<span${glowClass}>${q}</span>`); turnCount++;

    const isEnding = q.includes('都听到了') || q.includes('记住你了');
    await speakText(q, 'TAPE');
    isProcessing = false;

    if (isEnding) {
      sessionEnded = true;
      setHint('');
      document.getElementById('record-btn').style.display = 'none';
      document.getElementById('seal-btn').style.display = 'none';
      document.getElementById('ending-card').style.display = 'block';
      stopReels();
    } else {
      document.getElementById('record-btn').disabled = false;
      setHint('点击开始回答'); stopReels(); setStatus('');
    }
  } catch(e) {
    isProcessing = false;
    document.getElementById('record-btn').disabled = false;
    setStatus(''); setQuestion(`⚠️ ${e.message}`); setHint('请刷新重试'); stopReels();
  }
}

// 默认音色
const DEFAULT_VOICE_ID = 'APSIkVZudNbPAwyPoeVO'; // 女声

// ─── TTS ────────────────────────────────
// ─── TTS 多音字预处理 ─────────────────────
// ─── 克隆 wow moment（承接句逻辑在 speakText 里）────────────────────

// ─── LLM 输出英文词后处理 ───────────────
function fixChineseOutput(text) {
  return text
    .replace(/\bproject\b/gi, '项目')
    .replace(/\bprojects\b/gi, '项目')
    .replace(/\bteam\b/gi, '团队')
    .replace(/\bfeeling\b/gi, '感觉')
    .replace(/\bfeelings\b/gi, '感受')
    .replace(/\bwork\b/gi, '工作')
    .replace(/\blife\b/gi, '生活')
    .replace(/\btime\b/gi, '时间')
    .replace(/\bfriend\b/gi, '朋友')
    .replace(/\bfriends\b/gi, '朋友们')
    .replace(/\bstress\b/gi, '压力')
    .replace(/\bgoal\b/gi, '目标')
    .replace(/\bdream\b/gi, '梦想');
}

function normalizeTTSText(text) {
  // 替换容易被误读的多音字/词，换成发音更明确的同义词
  return text
    // 「累」在「疲惫」语境下容易读成 lěi，换成「疲惫」「很累」保留语义
    .replace(/特别累/g, '特别疲惫')
    .replace(/好累/g, '好疲惫')
    .replace(/真的累/g, '真的很疲惫')
    .replace(/太累了/g, '太疲惫了')
    // 「还」在"还是/还有"语境读 hái，在"归还"读 huán，一般对话是 hái，保持不变
    // 「得」dé/děi/de 三音，「觉得」「感觉得到」容易混，换更清晰的写法
    .replace(/觉得到/g, '能感受到')
    // 「难」nán/nàn，「很难」是 nán，一般没问题
    // 「重」zhòng/chóng，「重要」是 zhòng，「重新」是 chóng，ElevenLabs 通常能处理
    // 「长」cháng/zhǎng，「很长时间」容易读 zhǎng，换掉
    .replace(/很长时间/g, '很久')
    .replace(/好长时间/g, '好久')
    .replace(/这么长时间/g, '这么久')
    // 「中」zhōng/zhòng，「心中」是 zhōng，一般没问题
    // 「空」kōng/kòng，「有空」是 kòng 容易读 kōng
    .replace(/有空吗/g, '有时间吗')
    .replace(/有空的/g, '有时间的')
    // 「数」shǔ/shù，「无数」是 wú shù，「数数」是 shǔ，一般无问题
    // 「假」jiǎ/jià，「假装」是 jiǎ，「放假」是 jià
    // 去掉中文感叹号/问号后的语气词避免奇怪停顿
    .replace(/，。/g, '。')
    .replace(/、。/g, '。');
}

async function speakText(text, label) {
  startReels();
  // 克隆刚完成：先用克隆音色说承接句，再说正文
  if (window._cloneJustDone && voiceId) {
    window._cloneJustDone = false;
    // 动态生成前半句（接用户最后说的），后半句固定
    const lastUserText = transcript.filter(i=>i.role==='user').slice(-1)[0]?.text || '';
    let bridgeFront = '';
    if (lastUserText) {
      try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_KEY}` },
          body: JSON.stringify({
            model: CHAT_MODEL,
            messages: [
              { role: 'system', content: '你是深夜电台主持人Tape。用一句简短的话（15字以内）自然地呼应用户刚说的内容，语气温柔，像是若有所思地接话，不要问问题，不要下结论，只是接住。只输出那一句话，不要其他内容。' },
              { role: 'user', content: `用户刚才说：「${lastUserText}」` }
            ],
            max_tokens: 40, temperature: 0.8
          })
        });
        if (res.ok) {
          const d = await res.json();
          bridgeFront = d.choices?.[0]?.message?.content?.trim() || '';
        }
      } catch(e) {}
    }
    const bridgeBack = '说到这里，你有没有感觉，我们好像已经认识很久了。';
    const qEl = document.getElementById('question-bubble');

    if (bridgeFront) {
      // 前半句：默认女声 ElevenLabs
      qEl.innerHTML = `<span>${bridgeFront}</span>`;
      await speakWithElevenLabs(bridgeFront, 'TAPE', DEFAULT_VOICE_ID);
      await new Promise(r => setTimeout(r, 300));
    }

    // 后半句：克隆音色（或默认女声）+ 发光
    qEl.innerHTML = `<span class="question-glow">${bridgeFront ? bridgeFront + ' ' : ''}${bridgeBack}</span>`;
    await speakWithElevenLabs(bridgeBack, 'TAPE', voiceId || DEFAULT_VOICE_ID);
    await new Promise(r => setTimeout(r, 400));
  }
  const cleanText = normalizeTTSText(text);
  // 始终用 ElevenLabs：克隆完用克隆音色，否则用默认音色
  await speakWithElevenLabs(cleanText, label, voiceId || DEFAULT_VOICE_ID);
  stopReels();
}

async function speakWithElevenLabs(text, label, vid) {
  try {
    const res = await fetch(ELEVEN_TTS(vid), {
      method: 'POST',
      headers: { 'xi-api-key': ELEVEN_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text, model_id: TTS_MODEL, language_code: 'zh',
        voice_settings: { stability: 0.5, similarity_boost: 0.85, style: 0.1, use_speaker_boost: true }
      })
    });
    if (!res.ok) throw new Error('TTS 失败');
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    // 缓存到播放列表
    ttsAudioUrls.push({ url, label: label || text.slice(0, 20) });
    const audio = new Audio(url);
    await new Promise(r => { audio.onended=r; audio.onerror=r; audio.play().catch(r); });
  } catch(e) {
    console.warn('ElevenLabs TTS fallback:', e.message);
    // 降级：浏览器合成（不缓存，不影响回放列表）
    await speakWithBrowser(text);
  }
}

function initBrowserVoice() {
  return new Promise(resolve => {
    const tryLoad = () => {
      const vs = speechSynthesis.getVoices();
      ttsVoice = vs.find(v=>v.lang==='zh-CN') || vs.find(v=>v.lang.startsWith('zh')) || vs[0] || null;
      resolve();
    };
    speechSynthesis.getVoices().length > 0 ? tryLoad() : (speechSynthesis.onvoiceschanged=tryLoad, setTimeout(tryLoad,1200));
  });
}

function speakWithBrowser(text) {
  return new Promise(resolve => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='zh-CN'; u.rate=0.9; u.pitch=1.0;
    if (ttsVoice) u.voice=ttsVoice;
    u.onend=resolve; u.onerror=resolve;
    speechSynthesis.speak(u);
    setTimeout(resolve, 15000);
  });
}

// ─── 录音 ───────────────────────────────
async function toggleRecord() {
  if (isProcessing || sessionEnded) return;
  isRecording ? await stopRecording() : await startRecording();
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
    mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.start(100); isRecording = true;
    document.getElementById('record-btn').classList.add('recording');
    document.getElementById('mic-icon').style.display  = 'none';
    document.getElementById('stop-icon').style.display = 'block';
    setHint('录音中… 说完点击停止'); startReels();
    mediaRecorder._startTime = Date.now();
  } catch(e) { alert('无法访问麦克风：' + e.message); }
}

async function stopRecording() {
  isRecording = false;
  const recordDuration = Date.now() - (mediaRecorder._startTime || Date.now());
  document.getElementById('record-btn').classList.remove('recording');
  document.getElementById('mic-icon').style.display  = 'block';
  document.getElementById('stop-icon').style.display = 'none';
  setHint('处理中…');
  const mime = mediaRecorder.mimeType;
  await new Promise(r => { mediaRecorder.onstop=r; mediaRecorder.stop(); });
  mediaRecorder.stream.getTracks().forEach(t => t.stop());

  // 静默累计声音样本
  if (cloneState !== 'done') {
    voiceChunks.push(...audioChunks);
    voiceTotalMs += recordDuration;
    console.log(`[CLONE] 累计录音: ${(voiceTotalMs/1000).toFixed(1)}s / 门槛: ${nextCloneThreshold/1000}s, state: ${cloneState}`);
    if (cloneState !== 'cloning') cloneState = 'accumulating';
    if (voiceTotalMs >= nextCloneThreshold) {
      nextCloneThreshold += CLONE_STEP_MS;
      cloneState = 'cloning';
      setPip('cloning');
      console.log(`[CLONE] 触发克隆，样本大小: ${voiceChunks.length} 块`);
      silentClone(mime);
    }
  }

  const blob = new Blob(audioChunks, { type: mime });

  // 缓存用户录音到播放列表
  const userUrl = URL.createObjectURL(blob);
  ttsAudioUrls.push({ url: userUrl, label: `你说` });

  isProcessing = true;
  document.getElementById('record-btn').disabled = true;
  setQuestion(dots());
  try {
    const ext  = mime.includes('mp4') ? 'mp4' : 'webm';
    const form = new FormData();
    form.append('file', blob, `rec.${ext}`);
    form.append('model', STT_MODEL);
    form.append('language', 'zh');
    form.append('response_format', 'json');
    form.append('prompt', '以下是普通话对话，请用中文输出，不要用英文替换中文词汇。项目、工作、感觉、时间、朋友、事情。');

    const res = await fetch(GROQ_STT, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${GROQ_KEY}` },
      body: form
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.error?.message || 'STT 失败'); }
    const txt = (await res.json()).text?.trim();
    if (!txt) {
      setQuestion('没有听到内容，再试一次。');
      setHint('点击重新回答');
      isProcessing=false; document.getElementById('record-btn').disabled=false; return;
    }
    transcript.push({ role: 'user', text: txt });
    setQuestion(`<span style="color:#8a7a5a;font-size:12px;letter-spacing:1px;">你说</span><br/><br/>${txt}`);
    startReels();
    // 把用户这句话传给 Gemini
    isProcessing = true;
    document.getElementById('record-btn').disabled = true;
    const rawQ = await callGemini(txt);
    const q = fixChineseOutput(rawQ);
    transcript.push({ role: 'tape', text: q });
    const glowClass = window._nextQuestionGlow ? ' class="question-glow"' : '';
    window._nextQuestionGlow = false;
    setQuestion(`<span${glowClass}>${q}</span>`); turnCount++;
    const isEnding = q.includes('都听到了') || q.includes('记住你了');
    await speakText(q, 'TAPE');
    isProcessing = false;
    if (isEnding) {
      sessionEnded = true; setHint('');
      document.getElementById('record-btn').style.display = 'none';
      document.getElementById('seal-btn').style.display = 'none';
      document.getElementById('ending-card').style.display = 'block';
      stopReels();
    } else {
      document.getElementById('record-btn').disabled = false;
      setHint('点击开始回答'); stopReels(); setStatus('');
    }
  } catch(e) {
    isProcessing=false; document.getElementById('record-btn').disabled=false;
    setQuestion(`⚠️ ${e.message}`); setHint('点击重试'); stopReels();
  }
}

// ─── 后台克隆（每30秒一次，越来越像）───
async function silentClone(mime) {
  try {
    const blob = new Blob(voiceChunks, { type: mime });
    const ext  = mime.includes('mp4') ? 'mp4' : 'webm';
    const form = new FormData();
    const name = `tape-${Date.now()}`;
    form.append('name', name);
    form.append('description', 'Tape voice clone - Chinese');
    form.append('labels[language]', 'zh');
    form.append('files', blob, `sample.${ext}`);

    const res = await fetch(ELEVEN_CLONE, {
      method: 'POST',
      headers: { 'xi-api-key': ELEVEN_KEY },
      body: form
    });
    if (!res.ok) {
      const errText = await res.text();
      console.warn(`[CLONE] API失败 ${res.status}:`, errText);
      cloneState = 'accumulating'; setPip(''); return;
    }
    const data = await res.json();
    if (data.voice_id) {
      if (voiceId && voiceId !== data.voice_id) {
        fetch(`https://api.elevenlabs.io/v1/voices/${voiceId}`, { method: 'DELETE', headers: { 'xi-api-key': ELEVEN_KEY } }).catch(()=>{});
      }
      voiceId = data.voice_id;
      cloneState = 'done';
      setPip('done');
      window._cloneJustDone = true;
      console.log(`[CLONE] 克隆成功！voice_id: ${voiceId}`);
      setTimeout(() => setPip(''), 3000);
    } else {
      console.warn('[CLONE] 返回数据没有 voice_id:', data);
    }
  } catch(e) {
    console.warn('后台克隆失败:', e.message);
    cloneState = 'accumulating'; setPip('');
  }
}

  speechSynthesis.cancel();

    playlistIndex = 0; isPlaying = false;
    updatePlayerUI();
  }

// ─── 节目音频状态 ────────────────────────
let showAudio = null;
let showAudioPlaying = false;
let showAudioUrl = '';

// ─── BGM ────────────────────────────────
let bgmBuffer = null;
let audioCtx = null;

// 程序生成 ambient BGM（不依赖外链）
// 用叠加的正弦波+滤波器模拟舒缓 pad 音效
async function loadBgm() {
  if (bgmBuffer) return bgmBuffer;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const sampleRate = audioCtx.sampleRate;
    const duration = 30; // 生成30秒，循环用
    const length = sampleRate * duration;
    const buffer = audioCtx.createBuffer(2, length, sampleRate);

    // 音符频率：Am 调，舒缓感
    const notes = [220, 261.63, 329.63, 392, 440, 523.25];
    for (let ch = 0; ch < 2; ch++) {
      const data = buffer.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        const t = i / sampleRate;
        let val = 0;
        notes.forEach((freq, idx) => {
          // 每个音符有不同的慢速 LFO 调制
          const lfo = Math.sin(2 * Math.PI * 0.05 * (t + idx * 2));
          const amp = 0.03 + 0.015 * lfo;
          // 轻微 detune，增加温暖感
          const detune = 1 + (ch === 0 ? 0.001 : -0.001) * (idx + 1);
          val += amp * Math.sin(2 * Math.PI * freq * detune * t);
          // 泛音
          val += amp * 0.3 * Math.sin(2 * Math.PI * freq * 2 * detune * t);
        });
        // 整体包络：避免爆音
        const envFade = Math.min(1, t / 2) * Math.min(1, (duration - t) / 2);
        data[i] = val * envFade * 0.4;
      }
    }
    bgmBuffer = buffer;
  } catch(e) { console.warn('BGM generate failed:', e.message); bgmBuffer = null; }
  return bgmBuffer;
}

// 把人声 blob 和 BGM 混音，返回混音后的 blob（mp3/wav）
async function mixWithBgm(voiceBlob) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const bgm = await loadBgm();
    if (!bgm) return voiceBlob; // BGM 加载失败，直接返回原声

    // 解码人声
    const voiceArr = await voiceBlob.arrayBuffer();
    const voiceBuffer = await audioCtx.decodeAudioData(voiceArr);

    // 混音长度 = 人声时长 + 2秒淡出
    const duration = voiceBuffer.duration + 2;
    const sampleRate = audioCtx.sampleRate;
    const totalSamples = Math.ceil(duration * sampleRate);
    const channels = 2;
    const offlineCtx = new OfflineAudioContext(channels, totalSamples, sampleRate);

    // 人声节点（正常音量）
    const voiceSrc = offlineCtx.createBufferSource();
    voiceSrc.buffer = voiceBuffer;
    const voiceGain = offlineCtx.createGain();
    voiceGain.gain.setValueAtTime(1.0, 0);
    // 最后1秒淡出
    voiceGain.gain.setValueAtTime(1.0, duration - 1);
    voiceGain.gain.linearRampToValueAtTime(0, duration);
    voiceSrc.connect(voiceGain);
    voiceGain.connect(offlineCtx.destination);
    voiceSrc.start(0);

    // BGM 节点（低音量，循环）
    const bgmSrc = offlineCtx.createBufferSource();
    bgmSrc.buffer = bgm;
    bgmSrc.loop = true;
    const bgmGain = offlineCtx.createGain();
    // 开头2秒淡入
    bgmGain.gain.setValueAtTime(0, 0);
    bgmGain.gain.linearRampToValueAtTime(0.12, 2);
    // 结尾2秒淡出
    bgmGain.gain.setValueAtTime(0.12, duration - 2);
    bgmGain.gain.linearRampToValueAtTime(0, duration);
    bgmSrc.connect(bgmGain);
    bgmGain.connect(offlineCtx.destination);
    bgmSrc.start(0);

    // 离线渲染
    const rendered = await offlineCtx.startRendering();

    // 转成 wav blob
    const wavBlob = audioBufferToWav(rendered);
    return wavBlob;
  } catch(e) {
    console.warn('混音失败，使用原声:', e.message);
    return voiceBlob;
  }
}

// AudioBuffer → WAV Blob
function audioBufferToWav(buffer) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const length = buffer.length * numChannels * 2;
  const arrayBuffer = new ArrayBuffer(44 + length);
  const view = new DataView(arrayBuffer);
  const writeStr = (o, s) => { for (let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); };
  const writeUint32 = (o, v) => view.setUint32(o, v, true);
  const writeUint16 = (o, v) => view.setUint16(o, v, true);
  writeStr(0, 'RIFF'); writeUint32(4, 36 + length); writeStr(8, 'WAVE');
  writeStr(12, 'fmt '); writeUint32(16, 16); writeUint16(20, 1);
  writeUint16(22, numChannels); writeUint32(24, sampleRate);
  writeUint32(28, sampleRate * numChannels * 2); writeUint16(32, numChannels * 2);
  writeUint16(34, 16); writeStr(36, 'data'); writeUint32(40, length);
  let offset = 44;
  for (let i = 0; i < buffer.length; i++) {
    for (let ch = 0; ch < numChannels; ch++) {
      const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
      view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
      offset += 2;
    }
  }
  return new Blob([arrayBuffer], { type: 'audio/wav' });
}

// ─── AI 节目文案生成 ─────────────────────
async function generateShowText() {
  const el = document.getElementById('show-content');
  try {
    const convText = transcript.map(i=>`${i.role==='tape'?'Tape':'用户'}：${i.text}`).join('\n');
    const res = await fetch(GROQ_CHAT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_KEY}` },
      body: JSON.stringify({
        model: CHAT_MODEL,
        messages: [
          { role: 'system', content: `你是深夜电台节目「TAPE」的主持人。你刚刚陪一个真实的人聊完了一段对话，你被其中某些东西真实地触动了。

请用 JSON 格式输出，结构如下：
{"title":"...","content":"..."}

title 要求：
- 只输出标题本身，不加解释、引号、编号
- 字数 ≤ 9字符（含标点，不含 Vol. 编号）
- 风格二选一：
  A. 白描场景式——抓对话中出现的具体场景、物件或细节，不加修饰（适用：对话有清晰外部场景）示例：雪山前的留白 / 又路过那家店
  B. 内心动作式——提炼用户在这段对话里完成的某个内心过程，动词感强，不下结论（适用：对话偏内向无明显外部场景）示例：我学着与焦虑共处 / 漂浮也是一种在场
- 禁止：「成长」「治愈」「自我」「勇敢」「释怀」「感悟」等空泛词 / 口号 / 鸡汤 / 对话直接摘要 / 带感叹号

content 要求：
- 600-800字，适合朗读，约4-5分钟
- 第二人称「你」，从主持人自己的感受出发
- 有情绪起伏：有低点，有转折，有某个瞬间情绪浓烈，最后落地
- 语言口语，句子短，只用句号和逗号，禁止省略号和破折号
- 不用「我理解你」「你很勇敢」「每个人都」这类套话
- 捕捉对话里一个非常具体的细节，把它放大
- 结尾一句要有重量` },
          { role: 'user', content: convText }
        ],
        max_tokens: 2000, temperature: 0.9
      })
    });
    if (!res.ok) throw new Error();
    const d = await res.json();
    const raw = d.choices?.[0]?.message?.content?.trim() || '';
    let title = '', text = '';
    try {
      const jsonStr = raw.match(/\{[\s\S]*\}/)?.[0] || raw;
      const parsed = JSON.parse(jsonStr);
      title = parsed.title || '';
      text = parsed.content || '';
    } catch(e) {
      // JSON 解析失败（可能被截断），用正则单独提取 title 和 content
      const titleMatch = raw.match(/"title"\s*:\s*"([^"]+)"/);
      const contentMatch = raw.match(/"content"\s*:\s*"([\s\S]+?)(?:"\s*\}|$)/);
      title = titleMatch?.[1] || '';
      text = contentMatch?.[1]?.replace(/\\n/g, '\n') || raw.replace(/^\{"title":"[^"]*","content":"/, '').replace(/"\}$/, '');
    }
    // 如果 text 仍然包含 JSON 结构（解析彻底失败），清掉 JSON 包装直接用正文
    if (text.startsWith('{"title"') || text.startsWith('{\"title\"')) {
      text = text.replace(/^\{.*?"content"\s*:\s*"/, '').replace(/"\}$/, '');
    }
    if (text) {
      // 显示标题（Vol XX. + 标题）
      if (title) {
        const volStr = `Vol. ${String(window._currentVol || 1).padStart(2, '0')}${title}`;
        document.getElementById('tape-date').textContent = volStr;
      }
      el.innerHTML = `<div class="show-text">${text.replace(/\n/g,'<br/>')}</div>`;
      el.dataset.showText = text;
      document.getElementById('show-gen-wrap').style.display = 'block';
    } else {
      el.innerHTML = '<div style="color:#6a5a3a;font-size:13px;">今天的对话，已被好好记住了。</div>';
    }
  } catch(e) {
    el.innerHTML = '<div style="color:#6a5a3a;font-size:13px;">今天的对话，已被好好记住了。</div>';
  }
}

// ─── 生成节目音频 ────────────────────────
async function generateShowAudio() {
  const btn = document.getElementById('show-gen-btn');
  const text = document.getElementById('show-content').dataset.showText;
  if (!text) return;

  btn.disabled = true;
  btn.textContent = '合成中…';

  try {
    const useVoice = voiceId || DEFAULT_VOICE_ID;
    const res = await fetch(ELEVEN_TTS(useVoice), {
      method: 'POST',
      headers: { 'xi-api-key': ELEVEN_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text,
        model_id: TTS_MODEL,
        language_code: 'zh',
        voice_settings: { stability: 0.5, similarity_boost: 0.85, style: 0.2, use_speaker_boost: true }
      })
    });
    if (!res.ok) throw new Error('TTS 失败');
    const voiceBlob = await res.blob();

    // BGM 混音
    btn.textContent = '混音中…';
    const finalBlob = await mixWithBgm(voiceBlob);
    showAudioUrl = URL.createObjectURL(finalBlob);

    // 设置下载链接
    const dl = document.getElementById('show-download-btn');
    const now = new Date();
    const ext = finalBlob.type.includes('wav') ? 'wav' : 'mp3';
    const fname = `TAPE_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.${ext}`;
    dl.href = showAudioUrl;
    dl.download = fname;

    // 显示播放器，隐藏生成按钮
    document.getElementById('show-gen-wrap').style.display = 'none';
    document.getElementById('show-audio-wrap').style.display = 'block';

    // 设置音频
    showAudio = new Audio(showAudioUrl);
    showAudio.ontimeupdate = () => {
      const dur = showAudio.duration || 0;
      const cur = showAudio.currentTime;
      document.getElementById('show-prog-bar').style.width = dur ? (cur/dur*100)+'%' : '0%';
      document.getElementById('show-prog-time').textContent = `${fmtTime(cur)} / ${fmtTime(dur)}`;
    };
    showAudio.onended = () => {
      showAudioPlaying = false;
      document.getElementById('show-play-icon').style.display = 'block';
      document.getElementById('show-pause-icon').style.display = 'none';
    };

  } catch(e) {
    btn.disabled = false;
    btn.textContent = '生成节目音频 ▶';
    alert('生成失败：' + e.message);
  }
}

function toggleShowAudio() {
  if (!showAudio) return;
  if (showAudioPlaying) {
    showAudio.pause();
    showAudioPlaying = false;
    document.getElementById('show-play-icon').style.display = 'block';
    document.getElementById('show-pause-icon').style.display = 'none';
  } else {
    showAudio.play();
    showAudioPlaying = true;
    document.getElementById('show-play-icon').style.display = 'none';
    document.getElementById('show-pause-icon').style.display = 'block';
  }
}

// ─── 音频播放器 ─────────────────────────
function updatePlayerUI() {
  if (!ttsAudioUrls.length) return;
  const item = ttsAudioUrls[playlistIndex];
  document.getElementById('player-track').textContent = `${playlistIndex+1}/${ttsAudioUrls.length}  ${item.label}`;
  document.getElementById('player-bar').style.width = '0%';
  document.getElementById('player-time').textContent = '0:00 / 0:00';
}

function togglePlay() {
  if (!ttsAudioUrls.length) return;
  isPlaying ? pausePlayback() : startPlayback();
}

function startPlayback() {
  if (currentAudio) { currentAudio.play(); isPlaying = true; updatePlayBtn(); return; }
  playItem(playlistIndex);
}

function pausePlayback() {
  if (currentAudio) { currentAudio.pause(); isPlaying = false; updatePlayBtn(); }
}

function playItem(idx) {
  if (idx >= ttsAudioUrls.length) { isPlaying=false; updatePlayBtn(); return; }
  playlistIndex = idx;
  updatePlayerUI();
  if (currentAudio) { currentAudio.pause(); currentAudio.ontimeupdate=null; currentAudio.onended=null; }
  currentAudio = new Audio(ttsAudioUrls[idx].url);
  currentAudio.ontimeupdate = () => {
    const dur = currentAudio.duration || 0;
    const cur = currentAudio.currentTime;
    document.getElementById('player-bar').style.width = dur ? (cur/dur*100)+'%' : '0%';
    document.getElementById('player-time').textContent = `${fmtTime(cur)} / ${fmtTime(dur)}`;
  };
  currentAudio.onended = () => { playItem(idx+1); };
  currentAudio.onerror = () => { playItem(idx+1); };
  currentAudio.play().catch(()=>{});
  isPlaying = true; updatePlayBtn();
}

function updatePlayBtn() {
  document.getElementById('play-icon').style.display  = isPlaying ? 'none' : 'block';
  document.getElementById('pause-icon').style.display = isPlaying ? 'block' : 'none';
}

// ─── 复制 ───────────────────────────────
function copyTranscript() {
  const now = new Date();
  const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  const showEl = document.getElementById('show-content');
  const showText = showEl?.querySelector('.show-text')?.textContent || '';
  const sep = showText ? `\n\n${showText}\n\n${'─'.repeat(24)}\n\n` : '\n\n';
  const h = `TAPE · ${dateStr}${sep}`;
  const b = transcript.map(i=>`${i.role==='tape'?'TAPE':'我'}：${i.text}`).join('\n\n');
  navigator.clipboard.writeText(h+b).then(()=>{
    document.getElementById('copy-btn').textContent='✓ 已复制';
    setTimeout(()=>document.getElementById('copy-btn').textContent='复制这盘磁带',2000);
  }).catch(()=>alert('复制失败'));
}

// ─── 重置 ───────────────────────────────
function restartSession() {
  if (currentAudio) { currentAudio.pause(); currentAudio=null; }
  if (showAudio) { showAudio.pause(); showAudio=null; }
  if (showAudioUrl) { URL.revokeObjectURL(showAudioUrl); showAudioUrl=''; }
  if (durationTimer) { clearInterval(durationTimer); durationTimer=null; }
  isPlaying = false; showAudioPlaying = false;
  ttsAudioUrls.forEach(item => URL.revokeObjectURL(item.url));
  ttsAudioUrls = [];
  const dh = document.getElementById('duration-hint');
  if (dh) dh.textContent = '';
  document.getElementById('show-audio-wrap').style.display = 'none';
  document.getElementById('show-gen-wrap').style.display = 'none';
  showScreen('screen-setup');
}
